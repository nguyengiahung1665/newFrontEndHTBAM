server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 2g;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    proxy_intercept_errors on;
    error_page 502 503 504 = @backend_unavailable;
  }

  location @backend_unavailable {
    default_type application/json;
    return 503 '{"message":"Backend HTBAM chưa sẵn sàng. Vui lòng thử lại sau."}';
  }

  location /hubs/ {
    proxy_pass http://backend:8080/hubs/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    try_files $uri =404;
  }

  location ~* \.(?:js|css|map|json|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    try_files $uri =404;

    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
  }
}
